[project]
name = "retrieval-guardrail"
version = "1.0.0"
description = "Retrieval as a Guardrail: engineering deterministic answers from natural language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ankit Surana", email = "ankitsurana002@gmail.com" }]

# The application itself uses only the Python standard library at runtime.
# The dependencies below are development / test conveniences only.
dependencies = []

[project.optional-dependencies]
dev = []

[tool.uv]
# Keep uv sync fast on machines that already have the interpreter.
compile-bytecode = false

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
